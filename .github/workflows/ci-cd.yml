
name: CI — Notification Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cake-shop-notification-service

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout notification-service
        uses: actions/checkout@v4
        with:
          path: urfu-cake-shop-notification-service

      - name: Checkout cake-core (стартер)
        uses: actions/checkout@v4
        with:
          repository: URFU-CakeShop/cake-core
          path: cake-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('urfu-cake-shop-notification-service/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Publish cake-core to MavenLocal
        working-directory: cake-core
        run: gradle :connection-starters-core:publishToMavenLocal --no-daemon

      - name: Build & Test notification-service
        working-directory: urfu-cake-shop-notification-service
        run: gradle build --no-daemon
        env:
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: test@test.com
          SPRING_MAIL_PASSWORD: test
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: urfu-cake-shop-notification-service/build/reports/tests/

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout notification-service
        uses: actions/checkout@v4
        with:
          path: urfu-cake-shop-notification-service

      - name: Checkout cake-core
        uses: actions/checkout@v4
        with:
          repository: URFU-CakeShop/cake-core
          path: cake-core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (теги)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: urfu-cake-shop-notification-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
