spring:
  application:
    name: notification-service

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

cake:
  kafka:
    streams:
      state-dir: /tmp/kafka-streams
      application-id: notification-service
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      num-stream-threads: 2
      topology-logging: true
      dlq:
        enable: true
management:
  endpoints:
    web:
      exposure:
        include: info,prometheus,health
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[notification.email.duration]": true
      slo:
        "[http.server.requests]": 500ms,1s,5s
        "[notification.email.duration]": 500ms,1s,5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ru.urfu.cake.shop.notification: INFO
    org.springframework.kafka: WARN
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG