
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-second
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TOOLS_LOG4J_PROP: "INFO,CONSOLE"
    command: >
      bash -c "export KAFKA_OPTS='-Dzookeeper.admin.enableServer=false' && /etc/confluent/docker/run"
    networks:
      - monitoring

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-second
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ENABLE_KRAFT: "false"
    networks:
      - monitoring

  notification-service:
    build:
      context: ..
      dockerfile: urfu-cake-shop-notification-service/Dockerfile
    container_name: cake-shop-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./config/notify.env
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-second
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-second
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
